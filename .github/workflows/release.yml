name: Publish to npm

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org/"
          package-manager-cache: false

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists; skipping publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$TAG does not exist; release will be published."
          fi

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: npm install

      - name: Build project
        if: steps.release.outputs.publish == 'true'
        run: npm run build

      - name: Create release tag
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.release.outputs.tag }}"
          git push origin "${{ steps.release.outputs.tag }}"

      - name: Publish to npm
        if: steps.release.outputs.publish == 'true'
        run: npm publish --access public
